# NLD 训练配置
# Native Latent Draft: 基于 VLM 原生隐空间的自适应多步推理解码
#
# 核心设计 (Coconut 等价的隐空间推理, 单 token recurrence):
#   1. 去掉外挂 Controller/PrefixKVProjector，直接在 VLM 原生空间思考
#   2. NativeLatentThinker: 极简设计 (step_embedding + output_norm)
#   3. 单个 thought token: 最后一个 token 的 hidden state 作为 "查询探针"
#   4. 历史信息全部通过 KV cache 提供 (Coconut 等价)
#   5. 多步演化 = recurrence: 输出 hidden 作为下一步输入 (Transformer as RNN cell)
#   6. 自适应退出: 退出 token 预测 OR 饱和信号 (双保险)
#   7. Hidden States 监督: Key Token Decoding Loss (Margin Ranking) + Exit Token Loss
#
# 可训练参数估算:
#   - NativeLatentThinker: ~1M (step_embedding + output_norm)
#   - VLM 全量: ~8.3B (FSDP 分布式管理)
#   - 总计: ~8.3B
# 基座模型配置
model:
  model_path: "/mnt/wfs/mmchongqingssdwfssz/project_luban_infra/luban_infra/model_factory/for_lucas_Qwen3-VL-8B-Instruct_export"
  hidden_size: 4096
  total_layers: 36
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

# NLD 配置
nld:
  # NativeLatentThinker 参数 (单 token recurrence, Coconut 等价)
  # 注意: 不再需要 num_thought_tokens, 固定为 1 (历史信息全在 KV cache 中)
  max_think_steps: 5             # 最大隐空间演化步数 (硬上限, 覆盖数据中 99.98% 的 num_stages 分布: 2~5)
  think_layer_start: 0           # 用于隐空间思考的 VLM 层起始 (L0, 全部层参与, Coconut 等价)
  think_layer_end: 36            # 用于隐空间思考的 VLM 层结束 (L35, 共 36 层)
  
  # 推理时饱和退出阈值 (退出 token 预测 OR 饱和信号, 双保险)
  saturation_exit_threshold: 0.99
  
  # Key Token Decoding Loss 权重 (直接塑形 hidden states 演化，不缩放)
  key_token_weight: 1.0

# 数据配置 (VCR Latent Reasoning 数据)
data:
  train_json: "/mnt/cephszjt/user_juntianzhang/LatentDraft/data/nld_phase1/vcr_latent_cot_v3_stage1_20k.json"
  image_base_dir: "/mnt/cephszjt/user_juntianzhang/LatentDraft/data/nld_phase1/raw/vcr"
  
  skip_image_check: true
  min_pixels: 3136
  max_pixels: 1048576               # 1024×1024, 约 670 个视觉 token, vision 耗时 1~2s
  max_seq_len: 8192                  # 充裕的序列长度, 避免截断长 reasoning
  use_system_prompt: true

# 训练配置
training:
  output_dir: "./outputs/nld_train"
  
  # FSDP 配置 (替代 DeepSpeed, 避免 gradient checkpointing + KV cache 冲突)
  fsdp: "full_shard auto_wrap"
  fsdp_config: "configs/fsdp_config.json"
  
  num_epochs: 2                  # 2 epochs (20K × 2 = 40K 有效样本)
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4  # 有效 batch = 1 × 4 × 8GPU = 32
  gradient_checkpointing: false   # 禁用: segment-wise forward + detach cache 已等效于 gradient checkpointing, 且与 KV cache 不兼容
  
  # 学习率策略
  learning_rate: 2.0e-5          # 全局 (TrainingArguments 需要)
  thinker_lr: 1.0e-4             # NativeLatentThinker (从头训练, 较大 lr)
  vlm_lr: 2.0e-5                 # VLM 基座 (全量微调)
  
  weight_decay: 0.01
  warmup_steps: 120               # ~10% of total steps (20K/32*2≈1250 steps)
  lr_scheduler_type: "cosine"     # cosine 调度器, 比 linear decay 更适合全量微调
  max_grad_norm: 1.0
  
  logging_steps: 20
  monitor_every_n_steps: 50
  save_steps: 500
  save_total_limit: 5
  eval_steps: 500
  num_workers: 4
  report_to: ["tensorboard"]

seed: 42
