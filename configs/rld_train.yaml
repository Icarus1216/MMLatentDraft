# RLD (Reflective Latent Draft) 训练配置
# 面向 Qwen3-VL-8B-Instruct 的步级"回看-验证"隐空间草稿
#
# 核心设计:
#   - 基座 L0~L17 冻结, L18~L35 通过 LoRA 协同训练 (Draft Evolver + VLM 协同)
#   - 训练 RLD Controller + PrefixKVProjector + LoRA (~34M 参数)
#   - 通过 PrefixKVProjector 将 draft 注入为 prefix KV (训推一致)
#   - 在 "Step N:" (N>=2) 和 "Final Answer:" 边界触发 "回看-验证" 更新
#   - 使用 Qwen3-VL-Instruct 原生格式 (Step N: + Final Answer:), 消除训推格式不一致
#   - Stage 1 不使用对比学习 loss, 依靠 CE + Grounding + Diversity + Commit loss 训练

# 基座模型配置
model:
  model_path: "/mnt/wfs/mmchongqingssdwfssz/project_luban_infra/luban_infra/model_factory/for_lucas_Qwen3-VL-8B-Instruct_export"
  hidden_size: 4096           # Qwen3-VL-8B 隐藏维度 (text_config.hidden_size)
  total_layers: 36            # Qwen3-VL-8B decoder 总层数 (text_config.num_hidden_layers=36)
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

# RLD Controller 配置
rld:
  # 维度配置
  d_z: 768                   # controller 空间维度 (独立于 KV 空间, 768 维提升图表/空间推理表达力)
  
  # 槽位配置
  num_evidence_slots: 16     # 冻结视觉证据槽 K_e
  num_draft_slots: 16        # 可擦写草稿槽 K_d
  num_trace_slots: 16        # 推理轨迹槽 K_t
  
  # KV 注入配置
  # (当前使用方案 A: Embedding 注入, prefix embedding 自然参与全层 attention)
  
  # 正则化
  lambda_div: 0.1            # 多样性正则化权重 (配合 threshold=0.3 的余弦惩罚, 只惩罚 cosim>0.3 的部分)
  max_scale: 0.3             # Scale 上界 (prefix KV 方案中主要用于 PrefixKVProjector 的范数约束)
  selective_injection: true   # 选择性注入 (保留用于未来扩展)
  
  # ====== 简化模式: 去掉 TraceUpdater 的累计轨迹压缩 ======
  # 设为 false 时: 直接用 S_c (当前 step 摘要) 作为 ReflectionModule 的 query
  # Z_d 通过残差步进自然累积历史信息, 不需要 T_c 再重复编码
  # 优势: 更短的梯度路径 (4层CA vs 7层CA), 更精准的检索 query, 节省 ~3.5M 参数
  # 设为 true 时: 保持传统的 TraceUpdater 累计轨迹模式 (兼容旧 checkpoint)
  use_trace_updater: false
  
  # ====== 双向检索-验证模式 ======
  # 设为 true 时: 去掉 EvidenceResampler 的 16 slots 压缩, 直接用 visual_hidden_proj (~500 tokens)
  # 方向1: CA(Q=S_c, KV=visual_hidden_proj) → R_c (推理→图像, 精准检索)
  # 方向2: CA(Q=R_c, KV=S_c) → G_c (图像→推理, 反向验证)
  # 优势: 检索精度 ×30 (375K vs 12K 标量), 纠错信号更强, 参数量净增仅 ~1M
  # 设为 false 时: 保持旧的 EvidenceResampler + 单向 ReflectionModule (兼容旧 checkpoint)
  use_bidirectional_reflection: true
  
  # ====== LoRA 协同训练配置 ======
  # Stage 1 即启用 LoRA, 让基座中高层 (L18~L35) 适配 prefix KV 的注入模式
  # LoRA 让注入层的 Q/K/V/O 投影学会更好地"查询"和"协调" prefix KV
  # 参数量较小 (~9M), 不会显著增加显存
  lora:
    enabled: true              # 是否启用 LoRA
    r: 16                      # LoRA 秩
    alpha: 32                  # LoRA 缩放因子 (alpha/r = 2, 标准缩放)
    dropout: 0.05              # LoRA dropout
    target_modules:            # 目标模块 (注入层的 attention 投影, 含 k_proj 以适配 prefix KV 注入)
      - q_proj
      - k_proj
      - v_proj
    layers: null               # 应用层范围 (null = 默认 L18~L35, 即注入层范围内的所有层)

# 数据配置
data:
  # 训练数据: JSON 格式
  # Stage 1 使用纯 correct_cot (dataset_converted) 数据, 50K 条
  # 全部 think + answer 参与 CE loss, 提供密集一致的监督信号
  # 每个样本: {"image": path, "question": text, "answer": text, "think_chain": text, ...}
  train_json: "/mnt/cephszjt/user_juntianzhang/LatentDraft/data/rld_50k_newformat.json"
  # eval_json: "/path/to/your/rld_val.json"   # 可选，暂未配置
  
  # 自动分步: 对于无预生成推理链的数据，按句号/换行自动分段为 "Step N:" 格式
  auto_split_steps: true
  
  # 跳过图片存在性检查: 数据已通过 scripts/prefilter_data.py 预过滤时设为 true
  # 可节省每次训练启动时 ~4 分钟的 IO 检查时间 (297K 样本 × 8 进程)
  skip_image_check: true
  
  # 图片分辨率限制: 控制 Qwen3-VL 动态分辨率的上限
  # Qwen3-VL 默认 max_pixels=12845056 (≈3584×3584), 高分辨率图片会产生 3000~5000 个
  # 视觉 token, 导致 ViT 编码器耗时 30~40s/张 (O(N²) self-attention)。
  # 限制 max_pixels 可将 vision 耗时从 30~40s 降到 1~2s, 同时消除 rank 间耗时差异。
  # | max_pixels | 约等于分辨率 | 视觉 token 数 | vision 耗时 |
  # |  1003520   | ~1000×1000  |    ~600      |   1~2s  ✅  |
  # |   501760   |  ~700×700   |    ~350      |   <1s   ✅  |
  min_pixels: 3136           # 56×56 = 最小 1 个 patch
  max_pixels: 1003520        # ≈1000×1000, 约 600 个视觉 token, vision 耗时 1~2s

  # 序列最大长度: 超过此长度的样本会被截断/跳过 (防止 OOM 和 NCCL 超时)
  # 注意: 限制 max_pixels 后视觉 token 数大幅减少 (~600), 留给 think+answer 的空间更充裕。
  # 如果遇到 cudaErrorContained (NVLink 显存越界), 降低此值到 2048 或 1536。
  max_seq_len: 2048
  
  # P0: 困难样本下采样比例上限
  # pass_rate=0 的样本 (基座 4 次采样全错) 占比过高会导致 draft 学坏,
  # 将其下采样到不超过总数据的此比例。设为 1.0 则不下采样。
  # Stage 1 使用纯 correct_cot 数据, 无需下采样
  hard_sample_max_ratio: 1.0
  
  # System Prompt: 在对话中注入分步推理指令
  # 训练和推理时统一使用，引导模型自主按 "Step N:" + "Final Answer:" 格式输出
  # 与 rejection sampling 使用完全相同的 prompt, 确保训推格式一致
  use_system_prompt: true
  # system_prompt: null  # 使用默认 RLD_SYSTEM_PROMPT; 也可自定义字符串

# 训练配置
training:
  output_dir: "./outputs/rld_kv_prefix_768_bidirection_stage1"
  
  # 训练参数
  num_epochs: 1
  per_device_train_batch_size: 1     # Qwen3-VL-8B 显存压力更大，减小 batch size
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4     # 有效 batch_size = 1 * 4 * num_gpus (从16降低以加速训练)
  
  # 学习率
  learning_rate: 1.0e-4              # 全局学习率 (TrainingArguments 需要)
  controller_lr: 1.0e-4              # RLD Controller + PrefixKVProjector 学习率
  lora_lr: 3.0e-5                    # LoRA 学习率 (比 Controller 小 3×, 防止破坏基座能力)
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  
  # 日志
  logging_steps: 20
  monitor_every_n_steps: 50
  
  # 保存
  save_steps: 500
  save_total_limit: 3
  eval_steps: 500
  
  # 数据加载
  num_workers: 4
  
  # 分布式后端: 默认使用 PyTorch DDP (torchrun)，通信简单高效
  # 只需同步 61M 可训练参数的梯度 (1 次 allreduce)，显存开销几乎不变
  # 如需使用 DeepSpeed ZeRO-2，在命令行添加 --use_deepspeed 参数即可启用
  # deepspeed_config: "configs/ds_config_zero2.json"
  
  # 报告
  report_to: ["tensorboard"]

# 随机种子
seed: 42
