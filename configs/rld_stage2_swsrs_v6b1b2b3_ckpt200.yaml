# ============================================================
#  NLD Stage-2 training config (generic template)
#  ----------------------------------------------------------
#  This file keeps all hyper-parameters that worked in our
#  experiments but does NOT bind to any specific dataset or
#  resume checkpoint. Replace the <PATH_TO_*> placeholders
#  before running.
# ============================================================

# ============================================================
# Base model
# ============================================================
model:
  model_path: "<PATH_TO_QWEN3_VL_8B_INSTRUCT>"  # e.g. /path/to/Qwen3-VL-8B-Instruct
  hidden_size: 4096
  total_layers: 36
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

# ============================================================
# NativeLatentThinker
# ============================================================
nld:
  # Max latent steps at inference. During training the number of steps per
  # boundary is determined by the data (#stages per boundary).
  max_think_steps: 8

  # Think layers range (covers all 36 layers)
  think_layer_start: 0
  think_layer_end: 36

  # Saturation-based early-exit threshold at inference.
  saturation_exit_threshold: 0.99

  # Staged-DWAL loss weight (key-token weighted CE on latent steps).
  key_token_weight: 1.0

  # ------------------------------------------------------------
  # Anti-collapse regularizers (kept as 0 in released config —
  # the slerp-based transition-modality loss already prevents
  # collapse; flip these on if you observe degenerate hidden
  # states in your own data.)
  # ------------------------------------------------------------
  exit_margin: 2.0
  exit_margin_weight: 0.0
  exit_margin_loss_weight: 0.0
  sw_srs_alpha: 0.7
  swsrs_anti_collapse_margin: 0.5
  swsrs_anti_collapse_weight: 0.0
  swsrs_anti_collapse_loss_weight: 0.0
  diversity_threshold: 0.95
  diversity_weight: 0.0
  diversity_loss_weight: 0.0

  # ------------------------------------------------------------
  # Transition-modality (slerp) anchor loss
  #   r = SLERP(v_bar, t_bar; alpha)
  #     alpha = abstract:0.75 / bridge:0.5 / unified:0.5 / concrete:0.25
  #   L = ReLU(cos(h, v_bar) - cos(h, r) + delta)
  #     + ReLU(cos(h, t_bar) - cos(h, r) + delta)
  # Requires a stage-role field on each latent step in the data.
  # ------------------------------------------------------------
  vision_loss_weight: 1.0
  vision_loss_total_weight: 1.0
  vision_top_k: 6
  vision_margin: 0.05

  # Optional model-only resume from a previous Stage-1 checkpoint.
  # Set to a directory containing model.safetensors, or leave blank
  # to train from the base model.
  resume_from_model_only: "<PATH_TO_STAGE1_CHECKPOINT>"

# ============================================================
# Data
# ============================================================
data:
  train_json: "<PATH_TO_TRAIN_JSON>"  # latent-CoT json (see README sample)
  image_base_dir: "."
  skip_image_check: true
  min_pixels: 3136             # 56x56
  max_pixels: 1048576          # 1024x1024
  max_seq_len: 8192
  use_system_prompt: true

# ============================================================
# Training
# ============================================================
training:
  output_dir: "./outputs/nld_stage2"

  # FSDP
  fsdp: "full_shard auto_wrap"
  fsdp_config: "configs/fsdp_config.json"

  num_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: false   # incompatible with KV cache + multi-forward

  learning_rate: 5.0e-6
  thinker_lr: 2.0e-5
  vlm_lr: 5.0e-6

  weight_decay: 0.01
  warmup_steps: 50
  lr_scheduler_type: "cosine"
  max_grad_norm: 0.5

  logging_steps: 20
  monitor_every_n_steps: 20
  save_steps: 100
  save_total_limit: 8
  eval_steps: 500
  num_workers: 4
  report_to: ["tensorboard"]

# ============================================================
# Random seed
# ============================================================
seed: 42
