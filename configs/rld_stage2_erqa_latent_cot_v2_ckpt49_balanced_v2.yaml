# ============================================================
#  RLD Stage-2 · ERQA latent_cot_v2 · ckpt-49 balanced v2 继续训练
#  ----------------------------------------------------------
#  目标:
#    - 从 outputs/rld_stage2_erqa_vsibench_ckpt49_balanced_v2/checkpoint-49 继续训练
#    - 使用 ERQA latent_cot_v2 数据
#    - 训练 2 个 epoch
#    - 保持 v2 的 loss 权重配置
#
#  数据:
#    data/erqa/erqa_latent_cot_v2.json
#
#  起点 (resume_from_model_only):
#    outputs/rld_stage2_erqa_vsibench_ckpt49_balanced_v2/checkpoint-49
# ============================================================

# ============================================================
# 基座模型
# ============================================================
model:
  model_path: "<PATH_TO_QWEN3_VL_8B_INSTRUCT>"
  hidden_size: 4096
  total_layers: 36
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

# ============================================================
# NativeLatentThinker
# ============================================================
nld:
  max_think_steps: 8
  think_layer_start: 0
  think_layer_end: 36
  saturation_exit_threshold: 0.99

  # ====== Loss 权重 (保持 v2 配置) ======
  key_token_weight: 0.2

  # Anti-Collapse (保持关闭)
  exit_margin: 2.0
  exit_margin_weight: 0.0
  exit_margin_loss_weight: 0.0

  sw_srs_alpha: 0.7
  swsrs_anti_collapse_margin: 0.5
  swsrs_anti_collapse_weight: 0.0
  swsrs_anti_collapse_loss_weight: 0.0

  diversity_threshold: 0.95
  diversity_weight: 0.0
  diversity_loss_weight: 0.0

  # ====== Vision loss (保持 v2 增强配置) ======
  vision_loss_weight: 5.0
  vision_loss_total_weight: 3.0
  vision_top_k: 6
  vision_margin: 0.05

  # 从 ckpt-49 (balanced v2版) 加载模型权重
  resume_from_model_only: "./outputs/rld_stage2_erqa_vsibench_ckpt49_balanced_v2/checkpoint-49"

# ============================================================
# 数据 (ERQA latent_cot_v2)
# ============================================================
data:
  train_json: "./data/erqa/erqa_latent_cot_v2.json"
  image_base_dir: ""
  skip_image_check: true
  min_pixels: 3136
  max_pixels: 1048576
  max_seq_len: 8192
  use_system_prompt: true

# ============================================================
# 训练
# ============================================================
training:
  output_dir: "./outputs/rld_stage2_erqa_latent_cot_v2_ckpt49_balanced_v2"

  # FSDP
  fsdp: "full_shard auto_wrap"
  fsdp_config: "configs/fsdp_config.json"

  # 训练 2 个 epoch
  num_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: false

  # 学习率
  learning_rate: 1.0e-5
  thinker_lr: 1.0e-5
  vlm_lr: 1.0e-5

  weight_decay: 0.01
  warmup_steps: 3
  lr_scheduler_type: "cosine"
  max_grad_norm: 0.5

  # Logging / checkpoint
  logging_steps: 5
  monitor_every_n_steps: 5
  save_steps: 25
  save_total_limit: 4
  eval_steps: 500
  num_workers: 4
  report_to: ["tensorboard"]

# ============================================================
# 随机种子
# ============================================================
seed: 42